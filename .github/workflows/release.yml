name: release

# Tag-triggered only. Pushing `vX.Y.Z` is the one and only way this runs —
# there is no manual dispatch and no branch trigger, so a release always
# corresponds to an actual git tag someone deliberately pushed.
on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only the publish job, below, is granted more.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # One build per architecture, each on a machine of its own CPU. Nothing is
  # published from here: the publish job only runs once every one of these has
  # passed, so a failure on either architecture means no release at all.
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1

      # Fails fast, before spending any CI minutes on install/analyze/test,
      # if whoever cut this tag forgot to bump pubspec.yaml (or the version
      # in pubspec.yaml drifted from lib/src/core/version.dart's
      # `packageVersion`, which `winbridge --version` reports — the compiled-
      # binary check further down would otherwise be comparing against a
      # tag that was already wrong).
      - name: Tag must match pubspec.yaml's version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          pubspec_version="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')"
          if [ "$version" != "$pubspec_version" ]; then
            echo "::error::tag $tag (version $version) does not match the version in pubspec.yaml ($pubspec_version). Bump pubspec.yaml (and lib/src/core/version.dart) to $version, land that, and re-tag — a release must never ship a binary whose --version disagrees with the tag that built it." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      # A failing test suite must never reach a release — there is no step
      # after this one that can undo a bad build once assets are uploaded.
      - name: Test
        run: dart test

      - name: Compile
        run: dart compile exe bin/winbridge.dart -o winbridge

      # The expected version arrives through `env:`, not `${{ }}` interpolated
      # straight into the script, so the shell only ever sees it as a variable
      # value. Every other step here already does it this way; this one was the
      # exception, and an expression pasted into a `run:` block is the standard
      # way workflows grow a shell-injection hole later.
      - name: Verify the compiled binary reports the tagged version
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          reported="$(./winbridge --version | awk '{print $2}')"
          if [ "$reported" != "$EXPECTED" ]; then
            echo "::error::compiled binary reports version '$reported', expected '$EXPECTED'" >&2
            exit 1
          fi

      # Tarball and .deb for this runner's architecture, named and filled in by
      # the script CI runs on every pull request. It refuses to package a
      # binary that is not for the CPU it is running on.
      - name: Assemble the tarball and .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release/package-linux.sh "$VERSION" ./winbridge dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}-packages
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to this one job, not the workflow: creating a GitHub release and
    # uploading its assets is the only thing in this repo that ever needs
    # write access to the repository. ci.yml stays read-only end to end;
    # keeping the grant at job level here (rather than promoting the whole
    # workflow to write) means a step added to a *different* job later, in
    # either file, does not inherit it by accident.
    permissions:
      contents: write
    steps:
      # Only for scripts/release/checksums.sh; nothing from the tag is built here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*-packages
          merge-multiple: true
          path: dist

      # One SHA256SUMS over the x64 and arm64 tarballs and .debs. The script
      # fails if any of the four is missing, so a release can never go out
      # carrying only one architecture.
      - name: Checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          scripts/release/checksums.sh "${TAG#v}" dist

      # `gh` ships preinstalled on GitHub-hosted runners, so this needs no
      # extra action (and nothing extra to pin) beyond the token below.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" \
            "dist/winbridge-${version}-linux-x64.tar.gz" \
            "dist/winbridge_${version}-1_amd64.deb" \
            "dist/winbridge-${version}-linux-arm64.tar.gz" \
            "dist/winbridge_${version}-1_arm64.deb" \
            dist/SHA256SUMS \
            --title "WinBridge ${version}" \
            --generate-notes
