name: winbridge
title: WinBridge
version: '0.5.0'
summary: Build and run Windows apps from Linux, without leaving Linux
description: |
  WinBridge cross-compiles Windows binaries from Go, Rust, .NET, C/C++ and
  Flutter projects and checks every artifact for a real Windows PE32+ header
  before calling a build a success. It also runs existing Windows programs
  through a managed Wine runtime it downloads and verifies itself, with an
  isolated prefix per app, optional DXVK, winetricks, compatibility recipes
  and `winbridge desktop add` launchers.

  This snap uses classic confinement. WinBridge's whole job is to drive the
  toolchains you already have on the host (go, cargo, dotnet, zig, MinGW,
  clang, ssh, rsync) and to read and write project directories anywhere on
  the filesystem, which strict confinement cannot allow. WinBridge itself is
  the only thing inside the snap; it uses the host's tools rather than
  bundling its own.

  Quick start:

    winbridge doctor                # what is available, what is missing
    winbridge build ./myproject     # cross-compile for Windows
    winbridge run setup.exe         # run a Windows program under Wine

  `winbridge doctor` lists the toolchains that are missing and offers to
  install some of them (Go, Zig, NSIS) into ~/.cache/winbridge. Downloads
  rely on curl, tar, xz-utils, unzip and sha256sum from the host, and the
  optional Flutter build VM on ssh and rsync; a command that needs a missing
  tool stops and names it.

  Source, documentation and issues: https://github.com/Dhiva-Labs/WinBridge
license: MIT
website: https://github.com/Dhiva-Labs/WinBridge
source-code: https://github.com/Dhiva-Labs/WinBridge
issues: https://github.com/Dhiva-Labs/WinBridge/issues
contact: dhivakar1010@gmail.com

grade: stable
confinement: classic
base: core22
# Native builds only: each architecture is built on a machine of its own CPU
# (no cross-compiling), which is also what lets the override-build below pick
# the Dart SDK for the architecture it is running on.
architectures:
  - build-on: amd64
    build-for: amd64
  - build-on: arm64
    build-for: arm64

# The classic linter wants the ELF interpreter and rpath rewritten to the
# base snap's libc. That rewrite (patchelf) corrupts `dart compile exe`
# binaries: the AOT snapshot is appended to the ELF, and a patched binary
# runs but reports the bare Dart CLI's version. Verified with patchelf on
# the compiled winbridge. The binary only needs glibc >= 2.18, so the host's
# own dynamic linker is fine.
lint:
  ignore:
    - classic:
        - bin/winbridge

apps:
  winbridge:
    command: bin/winbridge
    environment:
      # Where `winbridge recipe` finds the bundled compatibility recipes
      # (lib/src/recipes/recipe_loader.dart, bundledRecipesDirVariable).
      WINBRIDGE_RECIPES_DIR: $SNAP/share/winbridge/recipes

parts:
  winbridge:
    plugin: nil
    source: .
    source-type: local
    build-packages:
      - ca-certificates
      - curl
      - unzip
    # The Dart AOT executable produced by `dart compile exe` carries its
    # snapshot as data appended to the ELF image. Rewriting the ELF (patchelf,
    # strip) corrupts it: the binary still starts but reports the bare Dart
    # CLI's version. debian/rules skips dh_strip for the same reason.
    build-attributes:
      - no-patchelf
    override-build: |
      set -eu

      # Pinned Dart SDK, matching what CI and the release binaries use
      # (pubspec.yaml needs ^3.8.0; the stable channel at release time was
      # 3.12.x). Built inside this core22 (Ubuntu 22.04, glibc 2.35) container
      # on purpose: the resulting executable then runs on any host with a
      # glibc at least that new. The build is native, so the SDK is the one for
      # the architecture of the container itself.
      DART_VERSION=3.12.2
      case "$(dpkg --print-architecture)" in
        amd64)
          DART_ARCH=x64
          DART_SHA256=28e47b44cf075f36771046c068bb0d174201cf9c7608744aed1cc23204299c2d
          ;;
        arm64)
          DART_ARCH=arm64
          DART_SHA256=f82c83ece7d168047550dfd4a664e4071ac7c488bddb72dc43102c22d7e0b518
          ;;
        *)
          echo "no pinned Dart SDK for $(dpkg --print-architecture)" >&2
          exit 1
          ;;
      esac
      DART_URL="https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-linux-${DART_ARCH}-release.zip"

      sdk_dir="$CRAFT_PART_BUILD/.toolchain"
      rm -rf "$sdk_dir"
      mkdir -p "$sdk_dir"
      curl --fail --location --silent --show-error --retry 5 --retry-delay 5 \
        --output "$sdk_dir/dartsdk.zip" "$DART_URL"
      echo "$DART_SHA256  $sdk_dir/dartsdk.zip" | sha256sum -c -
      unzip -q "$sdk_dir/dartsdk.zip" -d "$sdk_dir"
      rm "$sdk_dir/dartsdk.zip"

      export PATH="$sdk_dir/dart-sdk/bin:$PATH"
      export PUB_CACHE="$sdk_dir/pub-cache"
      export DART_SUPPRESS_ANALYTICS=true
      export CI=true

      # A host checkout may carry a .dart_tool whose package_config names
      # host paths; start from a clean slate.
      rm -rf .dart_tool build winbridge
      dart --version
      dart pub get --enforce-lockfile
      dart compile exe bin/winbridge.dart -o winbridge

      # Refuse to ship a binary whose --version disagrees with the snap.
      reported="$(./winbridge --version | awk '{print $2}')"
      if [ "$reported" != "$SNAPCRAFT_PROJECT_VERSION" ]; then
        echo "compiled winbridge reports '$reported', snap version is '$SNAPCRAFT_PROJECT_VERSION'" >&2
        exit 1
      fi

      install -Dm755 winbridge "$CRAFT_PART_INSTALL/bin/winbridge"

      # Data the CLI and its docs point at when installed from a checkout:
      # bundled recipes, the VM setup and printing scripts, documentation.
      data="$CRAFT_PART_INSTALL/share/winbridge"
      mkdir -p "$data"
      cp -r recipes "$data/recipes"
      cp -r scripts/vm "$data/vm"
      cp -r scripts/printing "$data/printing"
      doc="$CRAFT_PART_INSTALL/share/doc/winbridge"
      mkdir -p "$doc"
      install -m644 LICENSE README.md COMPATIBILITY.md "$doc/"
      cp -r docs "$doc/docs"
