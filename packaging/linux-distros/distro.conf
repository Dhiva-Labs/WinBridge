# Package metadata for the other-distribution packages (.rpm, Arch package,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb that
# scripts/release/package-linux.sh builds (and with debian/control).

NAME=winbridge
APP_NAME=WinBridge
GITHUB_REPO=Dhiva-Labs/WinBridge
TAG_PREFIX=v
SUMMARY='Build and run Windows apps from Linux, without leaving Linux'
DESCRIPTION='WinBridge cross-compiles Windows binaries from Go, Rust, .NET, C/C++ and Flutter projects and checks every artifact for a real Windows PE32+ header before calling a build a success. It also runs existing Windows programs through a managed Wine runtime it downloads and verifies itself, with an isolated prefix per app and optional DXVK for Direct3D-over-Vulkan rendering. No system Wine, no root, nothing to configure by hand.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/WinBridge
LICENSE=MIT
LICENSE_FILE=LICENSE

# The .deb depends on libc6 only; rpm gets its libc dependency from the ELF
# file. Wine, DXVK, winetricks, Go and Zig are downloaded by WinBridge itself
# and are not dependencies of any package.
RPM_REQUIRES=()
ARCH_DEPENDS=(glibc)
# The .deb's Recommends (openssh-client, rsync, curl, xz-utils): ssh and
# rsync drive the optional Flutter build VM, curl and xz fetch and unpack the
# pinned Wine/DXVK/winetricks archives on first use. Weak dependencies here
# too: file paths for rpm (Fedora and openSUSE name the packages
# differently), package names for Arch's optdepends.
RPM_RECOMMENDS=(/usr/bin/ssh /usr/bin/rsync /usr/bin/curl /usr/bin/xz)
ARCH_OPTDEPENDS=(
  'openssh: headless Windows VM for Flutter builds (winbridge vm)'
  'rsync: copying projects to the Windows VM'
  'curl: downloading the managed Wine, DXVK and winetricks'
  'xz: unpacking the managed Wine'
)
ARCH_INDEPENDENT=0

# A command-line tool: no AppImage, no Flatpak bundle from this workflow.
APPIMAGE=0

# Smoke test run in each distribution container by verify.sh (the repository
# is mounted read-only at /src). The same checks as the snap's: the version,
# the help text and project detection on a fixture.
SMOKE_CMD='winbridge --version | grep -E "^winbridge [0-9]+\.[0-9]+\.[0-9]+" && winbridge --help > /dev/null && winbridge detect /src/fixtures/hello_go'
GUI_CMD=''
SMOKE_SECONDS=20
